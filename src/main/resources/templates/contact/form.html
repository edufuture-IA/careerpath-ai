<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in" style="max-width:700px;">

    <div class="page-header">
        <h1>📩 Contáctanos</h1>
        <p>¿Eres un colegio o universidad interesada? Escríbenos.</p>
    </div>

    <div th:if="${param.sent}" class="alert alert-success">
        ¡Mensaje enviado! Te contactaremos pronto.
    </div>

    <div class="card">
        <form th:action="@{/contact}" th:object="${contactForm}" method="post">

            <div class="form-group">
                <label for="fullName">Nombre completo</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required>
                <span class="error" th:errors="*{fullName}" style="color:#dc2626; font-size:.8rem;"></span>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
                <span class="error" th:errors="*{email}" style="color:#dc2626; font-size:.8rem;"></span>
            </div>

            <div class="form-group">
                <label for="institutionName">Nombre de la institución (opcional)</label>
                <input type="text" id="institutionName" th:field="*{institutionName}" class="form-control">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono (opcional)</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control">
            </div>

            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" th:field="*{message}" class="form-control" rows="5" required></textarea>
                <span class="error" th:errors="*{message}" style="color:#dc2626; font-size:.8rem;"></span>
            </div>

            <button type="submit" class="btn-primary">Enviar Mensaje</button>
        </form>
    </div>
</main>

</body>
</html>
