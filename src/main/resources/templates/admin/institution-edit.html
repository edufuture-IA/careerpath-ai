<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Institución - CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in" style="max-width:700px;">

    <div class="page-header">
        <a th:href="@{/admin/institutions}" class="btn-ghost" style="padding-left:0;">← Volver</a>
        <h1>✏️ Editar Institución</h1>
        <p>Modifica los datos de la institución</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/admin/institutions/edit/{id}(id=${institution.id})}" method="post">

            <div class="form-group">
                <label>Nombre de la institución</label>
                <input type="text" name="name" th:value="${institution.name}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label>Correo de contacto</label>
                <input type="email" name="contactEmail" th:value="${institution.contactEmail}"
                       class="form-control" required>
            </div>
            <div class="form-group">
                <label>Dirección</label>
                <input type="text" name="address" th:value="${institution.address}"
                       class="form-control">
            </div>
            <div class="form-group">
                <label>Teléfono</label>
                <input type="text" name="phone" th:value="${institution.phone}"
                       class="form-control">
            </div>
            <div class="form-group">
                <label>Código de invitación (solo lectura)</label>
                <input type="text" th:value="${institution.invitationCode}"
                       class="form-control" readonly
                       style="background:#f8fafc; font-family:monospace; letter-spacing:.2rem;">
            </div>

            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn-primary">💾 Guardar Cambios</button>
                <a th:href="@{/admin/institutions}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</main>

</body>
</html>
