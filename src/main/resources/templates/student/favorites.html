<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Favoritos - CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in">

    <div class="page-header">
        <h1>⭐ Mis Carreras Favoritas</h1>
        <p>Carreras que has guardado para revisar más tarde</p>
    </div>

    <div th:if="${favorites.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">⭐</div>
        <p>Aún no has agregado carreras a favoritos.</p>
        <a th:href="@{/careers}" class="btn-primary" style="margin-top:1rem; display:inline-flex;">Explorar Carreras</a>
    </div>

    <div th:unless="${favorites.isEmpty()}" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:1.5rem;">
        <div th:each="fav : ${favorites}" class="card">
            <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:.8rem;">
                <h3 style="font-size:1.1rem; color:#0f172a;" th:text="${fav.career.name}">Carrera</h3>
                <span class="badge badge-blue" th:text="${fav.career.area}">Área</span>
            </div>
            <p style="color:#64748b; font-size:.9rem; margin-bottom:1rem;" th:text="${fav.career.description}">Descripción</p>
            <p style="font-size:.85rem; color:#475569;"><strong>Demanda:</strong>
                <span th:text="${#numbers.formatDecimal(fav.career.demandIndex * 100, 1, 0)} + '%'">95%</span>
            </p>
            <div style="display:flex; gap:.5rem; margin-top:1rem;">
                <a th:href="@{/careers/detail/{id}(id=${fav.career.id})}" class="btn-secondary btn-sm">Ver Detalle</a>
                <a th:href="@{/student/favorites/remove/{id}(id=${fav.career.id})}"
                   class="btn-danger"
                   onclick="return confirm('¿Eliminar de favoritos?')">Eliminar</a>
            </div>
        </div>
    </div>
</main>

</body>
</html>
