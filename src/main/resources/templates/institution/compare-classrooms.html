<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar Aulas - CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in">

    <div class="page-header">
        <a th:href="@{/institution/dashboard}" class="btn-ghost" style="padding-left:0;">← Volver al panel</a>
        <h1>📊 Comparación de Aulas</h1>
        <p>Analiza el desempeño y las tendencias por aula</p>
    </div>

    <div th:if="${classrooms.isEmpty()}" class="empty-state">
        <div class="empty-state-icon">🎓</div>
        <p>No hay aulas para comparar.</p>
    </div>

    <div th:unless="${classrooms.isEmpty()}">

        <!-- Tabla comparativa -->
        <div class="table-card" style="margin-bottom:2rem;">
            <table class="table">
                <thead>
                <tr>
                    <th>Aula</th>
                    <th>Grado</th>
                    <th>Alumnos</th>
                    <th>Docentes</th>
                    <th>Con test</th>
                    <th>Completado</th>
                    <th>Área top</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${classrooms}">
                    <td style="font-weight:700; color:#4f46e5;" th:text="${c.name}">5to A</td>
                    <td th:text="${summary.get(c.id).get('grade')}">-</td>
                    <td th:text="${summary.get(c.id).get('studentCount')}">0</td>
                    <td th:text="${summary.get(c.id).get('teacherCount')}">0</td>
                    <td th:text="${summary.get(c.id).get('studentsWithTest')}">0</td>
                    <td>
                        <span class="badge badge-blue"
                              th:text="${summary.get(c.id).get('completion')} + '%'">0%</span>
                    </td>
                    <td>
                        <span class="badge badge-purple"
                              th:text="${summary.get(c.id).get('topArea')}">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Gráficos por aula -->
        <div class="section-title">
            <h2>📈 Distribución por área de cada aula</h2>
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(350px, 1fr)); gap:1.5rem;">
            <div th:each="c : ${classrooms}" class="card">
                <h3 style="font-size:1rem; margin-bottom:1rem; color:#0f172a;"
                    th:text="${c.name} + ' — ' + ${c.grade}"></h3>
                <canvas th:id="'chart-' + ${c.id}" style="max-height:200px;"></canvas>
            </div>
        </div>
    </div>

</main>

<script th:inline="javascript">
    const distributions = /*[[${distributions}]]*/ {};

    Object.entries(distributions).forEach(([classroomId, dist]) => {
        const canvas = document.getElementById('chart-' + classroomId);
        if (!canvas) return;

        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: Object.keys(dist),
                datasets: [{
                    data: Object.values(dist),
                    backgroundColor: [
                        'rgba(79, 70, 229, 0.85)',
                        'rgba(236, 72, 153, 0.85)',
                        'rgba(6, 182, 212, 0.85)',
                        'rgba(245, 158, 11, 0.85)',
                        'rgba(16, 185, 129, 0.85)'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { size: 11 } } }
                }
            }
        });
    });
</script>

</body>
</html>
