<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil - CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in" style="max-width:700px;">

    <div class="page-header">
        <a th:href="@{/profile}" class="btn-ghost" style="padding-left:0;">← Volver al perfil</a>
        <h1>✏️ Editar Perfil</h1>
        <p>Actualiza tu información personal</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="card">
        <form th:action="@{/profile/edit}" th:object="${form}" method="post">

            <div class="form-group">
                <label for="fullName">Nombre completo</label>
                <input type="text" id="fullName" th:field="*{fullName}"
                       class="form-control" required>
                <span class="error" th:errors="*{fullName}"
                      style="color:#dc2626; font-size:.8rem;"></span>
            </div>

            <div class="form-group">
                <label for="username">Correo electrónico</label>
                <input type="email" id="username" th:field="*{username}"
                       class="form-control" required>
                <span class="error" th:errors="*{username}"
                      style="color:#dc2626; font-size:.8rem;"></span>
                <p style="font-size:.8rem; color:#64748b; margin-top:.4rem;">
                    💡 Este correo también es tu nombre de usuario para iniciar sesión.
                </p>
            </div>

            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn-primary">💾 Guardar Cambios</button>
                <a th:href="@{/profile}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

    <div class="alert alert-info" style="margin-top:2rem;">
        ℹ️ <strong>Nota:</strong> Si necesitas cambiar tu contraseña, contacta al administrador del sistema.
    </div>

</main>

</body>
</html>
