<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidades — CareerPath AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos específicos para la cuadrícula de universidades -->
    <style>
        .university-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .university-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            padding: 1.5rem;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .university-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.12);
            border-color: #c7d2fe;
        }

        /* Adorno superior de color */
        .university-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed, #ec4899);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .university-card:hover::before {
            opacity: 1;
        }

        .university-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: #f8fafc;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .university-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            flex-grow: 1; /* Empuja los botones hacia abajo */
        }

        .university-id {
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .university-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
            margin-top: auto;
        }

        .btn-view {
            flex: 1;
            text-align: center;
            background: #eef2ff;
            color: #4f46e5;
            padding: 0.6rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-view:hover {
            background: #4f46e5;
            color: #fff;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in">

    <div class="page-header" style="display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:1rem;">
        <div>
            <h1>Directorio de Universidades</h1>
            <p>Explora y conoce las instituciones disponibles en el sistema</p>
        </div>
        <a th:href="@{/universities/new}" class="btn-primary"
           th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''DOCENTE'')')}">
            + Nueva Universidad
        </a>
    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(universities)}" class="empty-state">
        <div class="empty-state-icon">🏫</div>
        <p>No hay universidades registradas en el sistema.</p>
    </div>

    <!-- Grid de Tarjetas -->
    <div th:unless="${#lists.isEmpty(universities)}" class="university-grid">
        
        <div class="university-card" th:each="u : ${universities}">
            <div class="university-icon">🏫</div>
            <div class="university-id" th:text="'ID: #' + ${u.id}"></div>
            <h3 class="university-name" th:text="${u.name}">Nombre de la Universidad</h3>
            
            <div class="university-actions">
                <!-- Botón Ver Detalle (Estilo principal) -->
                <a th:href="@{/universities/detail/{id}(id=${u.id})}" class="btn-view">
                    👁️ Ver Detalle
                </a>

                <!-- Botones de Edición (solo ADMIN/DOCENTE) -->
                <th:block th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''DOCENTE'')')}">
                    <a th:href="@{/universities/edit/{id}(id=${u.id})}" class="btn-ghost" style="padding: 0.6rem;" title="Editar">
                        ✏️
                    </a>
                    <a th:href="@{/universities/delete/{id}(id=${u.id})}" class="btn-danger" style="padding: 0.6rem;" 
                       onclick="return confirm('¿Eliminar esta universidad?')" title="Eliminar">
                        🗑️
                    </a>
                </th:block>
            </div>
        </div>

    </div>

</main>

</body>
</html>
