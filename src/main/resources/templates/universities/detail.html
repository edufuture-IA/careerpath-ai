<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${university.name} + ' — CareerPath AI'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in" style="max-width:800px;">

    <div class="page-header">
        <a th:href="@{/universities}" class="btn-ghost" style="padding-left:0;">← Volver al directorio</a>
    </div>

    <div class="card" style="padding: 3rem 2rem; border-top: 4px solid #4f46e5; text-align: center;">
        
        <div style="font-size: 4rem; margin-bottom: 1rem;">🏫</div>
        
        <h1 style="font-size:2.2rem; font-weight:800; color:#0f172a; margin-bottom:.5rem;" th:text="${university.name}"></h1>
        
        <span class="badge badge-blue" style="font-size: .9rem; padding: .4rem 1rem; margin-bottom: 2rem; display: inline-block;">
            Institución de Educación Superior
        </span>

        <div style="border-top:1px solid #e2e8f0; padding-top:2rem; text-align: left;">
            
            <div class="alert alert-info" style="display: flex; align-items: center; gap: 0.5rem; justify-content: center;">
                <span>ℹ️</span> 
                <span>Esta universidad aún no cuenta con una descripción detallada en el sistema.</span>
            </div>

            <!-- 
                ⚠️ SI TIENES MÁS CAMPOS EN TU CLASE University.java (ej. address, facultades, etc.)
                Puedes agregarlos aquí. Solo asegúrate de que el nombre coincida exactamente.
                Ejemplo:
                <p style="color:#334155; font-size: 1rem; margin-top: 1rem;">
                    <strong>Ubicación:</strong> <span th:text="${university.address}"></span>
                </p>
            -->

        </div>
    </div>

    <div style="display:flex; gap:1rem; margin-top:2rem; justify-content: center;">
        <a th:href="@{/universities/edit/{id}(id=${university.id})}" 
           class="btn-primary" 
           th:if="${#authorization.expression('hasAnyRole(''ADMIN'', ''DOCENTE'')')}">
            ✏️ Editar Información
        </a>
        <a th:href="@{/universities}" class="btn-secondary">Volver al Directorio</a>
    </div>

</main>

</body>
</html>
