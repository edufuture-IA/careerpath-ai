<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${university.id} == null ? 'Nueva Universidad' : 'Editar Universidad'"></title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="app-container fade-in" style="max-width:700px;">

    <div class="page-header">
        <a th:href="@{/universities}" class="btn-ghost" style="padding-left:0;">← Volver al directorio</a>
        <h1 th:text="${university.id} == null ? '➕ Registrar Universidad' : '✏️ Editar Universidad'"></h1>
        <p th:text="${university.id} == null ? 'Agrega una nueva institución al directorio' : 'Modifica los datos de la institución'"></p>
    </div>

    <div class="card">
        <form th:action="${university.id} == null
                          ? @{/universities}
                          : @{/universities/update/{id}(id=${university.id})}"
              th:object="${university}" method="post">

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" th:field="*{name}"
                       class="form-control" required>
            </div>

            <div class="form-group">
                <label for="website">Sitio web</label>
                <input type="url" id="website" th:field="*{website}"
                       class="form-control" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="city">Ciudad</label>
                <input type="text" id="city" th:field="*{city}"
                       class="form-control" placeholder="Ej: Lima">
            </div>

            <div class="form-group">
                <label for="logoUrl">URL del logo (opcional)</label>
                <input type="url" id="logoUrl" th:field="*{logoUrl}"
                       class="form-control" placeholder="https://...">
            </div>

            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" th:field="*{description}"
                          class="form-control" rows="4"
                          placeholder="Describe brevemente la institución"></textarea>
            </div>

            <div class="form-group">
                <label for="faculties">Facultades (separadas por coma)</label>
                <input type="text" id="faculties" th:field="*{faculties}"
                       class="form-control"
                       placeholder="Ingeniería,Negocios,Salud,Arte,Legal">
                <p style="font-size:.8rem; color:#64748b; margin-top:.4rem;">
                    💡 Ejemplo: Ingeniería,Negocios,Salud
                </p>
            </div>

            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
                <button type="submit" class="btn-primary"
                        th:text="${university.id} == null ? '💾 Guardar' : '💾 Guardar Cambios'"></button>
                <a th:href="@{/universities}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>

</main>

</body>
</html>
