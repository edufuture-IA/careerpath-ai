# La URL local de Ollama (no necesita API Key)
gemini.api.url=http://localhost:11434/v1/chat/completions
gemini.api.key=ollama

# El modelo que acabas de descargar
gemini.api.model=llama3.2

spring.application.name=careerpath-ai

# ===== PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careerpath_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Server =====
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===== JWT =====
# Secreto en Base64 (>= 256 bits). En producción define la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:Y2FyZWVycGF0aC1haS1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
# Expiración en milisegundos (1 hora)
app.jwt.expiration-ms=3600000

# ===== Logging =====
logging.level.org.springframework.security=INFO
ollama.search.url=https://ollama.com/api/web_search
ollama.search.api-key=${OLLAMA_API_KEY:}
