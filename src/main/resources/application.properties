spring.application.name=careerpath-ai

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/careerpath_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Server =====
server.port=8080

# ===== JWT =====
# Secreto en Base64 (>= 256 bits). En producción define la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:Y2FyZWVycGF0aC1haS1qd3Qtc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbi0yMDI2}
# Expiración en milisegundos (1 hora)
app.jwt.expiration-ms=3600000

# ===== Logging =====
logging.level.org.springframework.security=INFO